<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GAMERPRO GAME</title>

<link
    rel="stylesheet"
    href="./style.css"
>
</head>

<body>

<main id="game">

<section id="inicio">

<button
    id="playButton"
    type="button"
>
    PLAY
</button>

<button
    id="rigButton"
    type="button"
>
    🦴 EDITOR DE RIG
</button>

</section>

</main>


<!-- ================================================= -->
<!-- 🌐 THREE.JS -->
<!-- ================================================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<!-- ================================================= -->
<!-- 🦴 PRUEBA RIG MICAELA 3D -->
<!-- ================================================= -->

<script type="module">

import {
    iniciarRigMicaela
} from "./mecanicas/rigMicaela.js";


const game =
    document.getElementById("game");


iniciarRigMicaela(game);

</script>


<!-- ================================================= -->
<!-- 🦴 BOTÓN EDITOR DE RIG -->
<!-- ================================================= -->

<script>

const rigButton =
    document.getElementById("rigButton");


rigButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "./rig/";

    }
);

</script>


<!-- ================================================= -->
<!-- 🎮 GAMERPRO GAME -->
<!-- ================================================= -->

<script
    type="module"
    src="./game.js"
></script>

</body>

    </html>
