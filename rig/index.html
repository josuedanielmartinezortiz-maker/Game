<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
GAMERPRO — Visualizador de personajes
</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101010;

    font-family:
        Arial,
        sans-serif;

    color: white;
}


#visor {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101010;
}


#visor canvas {

    position: absolute;

    inset: 0;

    width: 100% !important;
    height: 100% !important;

    display: block;
}


#panel {

    position: fixed;

    top: 12px;
    left: 12px;

    width:
        min(
            330px,
            calc(100vw - 24px)
        );

    max-height:
        calc(100vh - 24px);

    overflow-y: auto;

    padding: 14px;

    z-index: 20;

    background:
        rgba(
            15,
            18,
            24,
            .95
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    border-radius: 14px;

    box-shadow:
        0 10px 35px
        rgba(
            0,
            0,
            0,
            .45
        );
}


#panel h1 {

    margin:
        0 0 4px;

    font-size: 20px;
}


#estado {

    margin-bottom: 12px;

    font-size: 12px;

    color: #9fe6a0;
}


.seccion {

    margin-top: 14px;

    padding-top: 12px;

    border-top:
        1px solid
        rgba(
            255,
            255,
            255,
            .10
        );
}


.seccion h2 {

    margin:
        0 0 7px;

    font-size: 14px;
}


select,
button {

    width: 100%;

    border: 0;

    border-radius: 9px;

    padding: 10px;

    margin-top: 6px;

    background:
        #272d38;

    color: white;

    font-size: 14px;
}


button:active {

    transform:
        scale(.98);
}


.info {

    margin-top: 8px;

    font-size: 12px;

    line-height: 1.5;

    color:
        #bfc7d5;
}


#error {

    color:
        #ff7777;

    white-space:
        pre-wrap;

    font-size: 12px;

    line-height: 1.4;
}


#mensaje {

    position: fixed;

    bottom: 14px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 30;

    padding:
        8px 13px;

    border-radius: 10px;

    background:
        rgba(
            0,
            0,
            0,
            .70
        );

    font-size: 12px;

    pointer-events: none;
}

</style>

</head>


<body>


<!-- =====================================================
     VISUALIZADOR
===================================================== -->

<div id="visor"></div>


<!-- =====================================================
     PANEL
===================================================== -->

<div id="panel">


    <h1>
        🎮 GAMERPRO
    </h1>


    <div id="estado">
        ⏳ Preparando visualizador...
    </div>


    <!-- =================================================
         PERSONAJE
    ================================================== -->

    <div class="seccion">

        <h2>
            🧍 Personaje
        </h2>


        <select
            id="personaje"
        >

            <option value="micaela">
                👧 Micaela
            </option>

            <option value="mike">
                👦 Mike
            </option>

        </select>

    </div>


    <!-- =================================================
         ANIMACIÓN
    ================================================== -->

    <div class="seccion">

        <h2>
            🎞️ Animación
        </h2>


        <select
            id="animacion"
        >

        </select>


        <button
            id="reiniciar"
        >
            🔄 Reiniciar animación
        </button>


        <button
            id="detener"
        >
            ⏸️ Detener en pose
        </button>


    </div>


    <!-- =================================================
         INFORMACIÓN
    ================================================== -->

    <div class="seccion">

        <h2>
            📊 Información
        </h2>


        <div
            id="info"
            class="info"
        >
            —
        </div>

    </div>


    <!-- =================================================
         ERRORES
    ================================================== -->

    <div class="seccion">

        <div
            id="error"
        ></div>

    </div>


</div>


<div id="mensaje">

    Visualizador del rig real · Micaela / Mike

</div>


<!-- =====================================================
     SCRIPT
===================================================== -->

<script type="module">


// =======================================================
// IMPORTAR LOS RIGS REALES
// =======================================================

import {
    iniciarMicaelaRig
}
from
    "../mecanicas/micaelaRig.js";


import {
    iniciarMikeRig
}
from
    "../mecanicas/mikeRig.js";


// =======================================================
// ELEMENTOS
// =======================================================

const visor =
    document.getElementById(
        "visor"
    );


const estado =
    document.getElementById(
        "estado"
    );


const personajeSelect =
    document.getElementById(
        "personaje"
    );


const animacionSelect =
    document.getElementById(
        "animacion"
    );


const info =
    document.getElementById(
        "info"
    );


const error =
    document.getElementById(
        "error"
    );


const reiniciar =
    document.getElementById(
        "reiniciar"
    );


const detener =
    document.getElementById(
        "detener"
    );


// =======================================================
// ESTADO
// =======================================================

let personajeActual =
    null;


let nombreActual =
    "micaela";


let animacionActual =
    "idle";


// =======================================================
// ANIMACIONES
// =======================================================

const animacionesMicaela = [

    "idle",

    "caminar",

    "correr",

    "saltar",

    "recolectar",

    "cavar",

    "regar",

    "feliz"

];


const animacionesMike = [

    "idle",

    "caminar",

    "correr",

    "saltar",

    "recolectar",

    "cavar",

    "regar"

];


// =======================================================
// PREPARAR SELECTOR
// =======================================================

function prepararAnimaciones(
    nombre
) {

    animacionSelect.innerHTML =
        "";


    const lista =
        nombre === "micaela"
            ? animacionesMicaela
            : animacionesMike;


    lista.forEach(
        nombreAnimacion => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                nombreAnimacion;


            option.textContent =
                nombreAnimacion;


            animacionSelect.appendChild(
                option
            );

        }
    );


    animacionSelect.value =
        animacionActual;

}


// =======================================================
// LIMPIAR VISUALIZADOR
// =======================================================

function limpiarVisor() {

    visor.innerHTML =
        "";


    personajeActual =
        null;

}


// =======================================================
// CARGAR MICAELA
// =======================================================

async function cargarMicaela() {

    limpiarVisor();


    estado.textContent =
        "⏳ Cargando Micaela...";


    try {

        personajeActual =
            await iniciarMicaelaRig(
                visor
            );


        nombreActual =
            "micaela";


        prepararAnimaciones(
            "micaela"
        );


        animacionActual =
            "idle";


        animacionSelect.value =
            "idle";


        personajeActual
            .userData
            .animacion(
                "idle"
            );


        mostrarInformacion();


        estado.textContent =
            "✅ Micaela lista";

    }

    catch (
        err
    ) {

        console.error(
            err
        );


        estado.textContent =
            "❌ Error cargando Micaela";


        error.textContent =
            String(
                err.stack ||
                err
            );

    }

}


// =======================================================
// CARGAR MIKE
// =======================================================

async function cargarMike() {

    limpiarVisor();


    estado.textContent =
        "⏳ Cargando Mike...";


    try {

        personajeActual =
            await iniciarMikeRig(
                visor
            );


        nombreActual =
            "mike";


        prepararAnimaciones(
            "mike"
        );


        animacionActual =
            "idle";


        animacionSelect.value =
            "idle";


        personajeActual
            .userData
            .animacion(
                "idle"
            );


        mostrarInformacion();


        estado.textContent =
            "✅ Mike listo";

    }

    catch (
        err
    ) {

        console.error(
            err
        );


        estado.textContent =
            "❌ Error cargando Mike";


        error.textContent =
            String(
                err.stack ||
                err
            );

    }

}


// =======================================================
// CAMBIAR PERSONAJE
// =======================================================

personajeSelect.addEventListener(
    "change",
    async function() {

        error.textContent =
            "";


        if (
            personajeSelect.value ===
            "mike"
        ) {

            await cargarMike();

        }

        else {

            await cargarMicaela();

        }

    }
);


// =======================================================
// CAMBIAR ANIMACIÓN
// =======================================================

animacionSelect.addEventListener(
    "change",
    function() {

        if (
            !personajeActual
        ) {

            return;

        }


        animacionActual =
            animacionSelect.value;


        personajeActual
            .userData
            .animacion(
                animacionActual
            );


        mostrarInformacion();

    }
);


// =======================================================
// REINICIAR ANIMACIÓN
// =======================================================

reiniciar.addEventListener(
    "click",
    function() {

        if (
            !personajeActual
        ) {

            return;

        }


        personajeActual
            .userData
            .animacion(
                animacionActual
            );


        estado.textContent =
            `▶️ ${
                nombreActual === "micaela"
                    ? "Micaela"
                    : "Mike"
            } · ${
                animacionActual
            }`;

    }
);


// =======================================================
// DETENER EN POSE
// =======================================================

detener.addEventListener(
    "click",
    function() {

        if (
            !personajeActual
        ) {

            return;

        }


        /*
         * Ponemos la animación en una
         * pose estática y dejamos de
         * cambiar de animación.
         */

        personajeActual
            .userData
            .animacion(
                ""
            );


        estado.textContent =
            "⏸️ Pose detenida";

    }
);


// =======================================================
// INFORMACIÓN
// =======================================================

function mostrarInformacion() {

    if (
        !personajeActual
    ) {

        return;

    }


    const bones =
        personajeActual
            .userData
            .bones || {};


    const numeroHuesos =
        Object.keys(
            bones
        ).length;


    const nombre =
        nombreActual === "micaela"
            ? "Micaela"
            : "Mike";


    info.innerHTML =

        `
        🧍 Personaje:
        <b>${nombre}</b>

        <br>

        🦴 Huesos del rig:
        <b>${numeroHuesos}</b>

        <br>

        🎞️ Animación:
        <b>${animacionActual}</b>

        <br>

        🦴 Skeleton:
        <b>${
            personajeActual
                .userData
                .skeleton
                ? "✅"
                : "❌"
        }</b>

        <br>

        🎮 Rig:
        <b>${
            personajeActual
                .userData
                .rig
                ? "✅"
                : "❌"
        }</b>
        `;

}


// =======================================================
// INICIAR
// =======================================================

cargarMicaela();


</script>

</body>

    </html>
