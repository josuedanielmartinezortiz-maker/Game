<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GAMERPRO — Visualizador de Rig</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #visor {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        #panel {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;

            width: min(360px, calc(100vw - 24px));

            padding: 14px;

            background: rgba(20, 20, 20, 0.92);
            color: white;

            border-radius: 14px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.45);
        }

        #titulo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #estado {
            padding: 10px;
            margin-bottom: 10px;

            background: #222;
            border-radius: 8px;

            font-size: 13px;
            line-height: 1.4;
        }

        #error {
            display: none;

            max-height: 180px;
            overflow: auto;

            padding: 10px;
            margin-bottom: 10px;

            background: #351515;
            color: #ffb5b5;

            border-radius: 8px;

            font-size: 11px;
            white-space: pre-wrap;
        }

        label {
            display: block;
            margin-top: 9px;
            margin-bottom: 4px;

            font-size: 12px;
            color: #bbb;
        }

        select,
        button {
            width: 100%;

            padding: 10px;

            border: 0;
            border-radius: 8px;

            font-size: 14px;
        }

        select {
            background: #333;
            color: white;
        }

        button {
            margin-top: 9px;

            background: #4b7bec;
            color: white;

            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        #info {
            margin-top: 10px;

            font-size: 12px;
            line-height: 1.5;

            color: #ccc;
        }

        .ok {
            color: #8cff9a;
        }

        .warn {
            color: #ffd36b;
        }

        .bad {
            color: #ff7d7d;
        }
    </style>
</head>

<body>

<div id="visor"></div>

<div id="panel">

    <div id="titulo">
        🎮 GAMERPRO — Visualizador
    </div>

    <div id="estado">
        🟡 JavaScript iniciando...
    </div>

    <div id="error"></div>

    <label for="personaje">
        Personaje
    </label>

    <select id="personaje">
        <option value="micaela">
            Micaela
        </option>

        <option value="mike">
            Mike
        </option>
    </select>

    <label for="animacion">
        Animación
    </label>

    <select id="animacion">
        <option value="idle">
            Idle
        </option>
    </select>

    <button id="recargar">
        🔄 Recargar personaje
    </button>

    <div id="info">
        Esperando al rig...
    </div>

</div>


<script type="module">

    // =====================================================
    // 🎮 GAMERPRO — VISUALIZADOR DE RIG
    // =====================================================

    const visor =
        document.getElementById("visor");

    const estado =
        document.getElementById("estado");

    const errorBox =
        document.getElementById("error");

    const personajeSelect =
        document.getElementById("personaje");

    const animacionSelect =
        document.getElementById("animacion");

    const recargar =
        document.getElementById("recargar");

    const info =
        document.getElementById("info");


    // =====================================================
    // ANIMACIONES DE MICAELA
    // =====================================================

    const animacionesMicaela = [
        "idle",
        "caminar",
        "correr",
        "saltar",
        "recolectar",
        "cavar",
        "regar",
        "feliz"
    ];


    // =====================================================
    // ANIMACIONES DE MIKE
    // =====================================================

    const animacionesMike = [
        "idle",
        "caminar",
        "correr",
        "saltar",
        "recolectar",
        "cavar",
        "regar"
    ];


    // =====================================================
    // PERSONAJE ACTUAL
    // =====================================================

    let personajeActual = null;


    // =====================================================
    // MOSTRAR ERROR
    // =====================================================

    function mostrarError(error) {

        console.error(error);

        errorBox.style.display = "block";

        errorBox.textContent =
            "❌ ERROR\n\n" +
            (
                error?.stack ||
                error?.message ||
                String(error)
            );

        estado.innerHTML =
            '<span class="bad">❌ Error al cargar el rig.</span>';
    }


    // =====================================================
    // ERRORES GLOBALES
    // =====================================================

    window.addEventListener(
        "error",
        (evento) => {

            mostrarError(
                evento.error ||
                new Error(evento.message)
            );

        }
    );


    window.addEventListener(
        "unhandledrejection",
        (evento) => {

            mostrarError(
                evento.reason
            );

        }
    );


    // =====================================================
    // LIMPIAR VISOR
    // =====================================================

    function limpiarVisor() {

        visor.innerHTML = "";

        personajeActual = null;

        errorBox.style.display = "none";

        errorBox.textContent = "";

    }


    // =====================================================
    // ACTUALIZAR LISTA DE ANIMACIONES
    // =====================================================

    function prepararAnimaciones(nombre) {

        animacionSelect.innerHTML = "";

        const lista =
            nombre === "mike"
                ? animacionesMike
                : animacionesMicaela;


        for (const animacion of lista) {

            const opcion =
                document.createElement("option");

            opcion.value =
                animacion;

            opcion.textContent =
                animacion;

            animacionSelect.appendChild(
                opcion
            );
        }


        animacionSelect.value =
            "idle";
    }


    // =====================================================
    // APLICAR ANIMACIÓN
    // =====================================================

    function aplicarAnimacion(nombre) {

        if (!personajeActual) {
            return;
        }

        if (
            !personajeActual.userData ||
            typeof personajeActual.userData.animacion !==
            "function"
        ) {

            info.textContent =
                "⚠️ El rig no expone la función de animación.";

            return;
        }


        personajeActual.userData.animacion(
            nombre
        );


        info.textContent =
            "🎬 Animación actual: " +
            nombre;
    }


    // =====================================================
    // CARGAR MICAELA
    // =====================================================

    async function cargarMicaela() {

        limpiarVisor();

        prepararAnimaciones(
            "micaela"
        );


        estado.innerHTML =
            '<span class="warn">🟡 Preparando Micaela...</span>';

        info.textContent =
            "Cargando mecanica/micaelaRig.js...";


        // Dejamos respirar al navegador para
        // que pueda pintar el mensaje.
        await new Promise(
            requestAnimationFrame
        );


        try {

            estado.innerHTML =
                '<span class="warn">⏳ Importando rig de Micaela...</span>';


            const modulo =
                await import(
                    "../mecanicas/micaelaRig.js?v=14"
                );


            estado.innerHTML =
                '<span class="warn">⏳ Ejecutando rig de Micaela...</span>';


            await new Promise(
                requestAnimationFrame
            );


            personajeActual =
                await modulo.iniciarMicaelaRig(
                    visor
                );


            personajeActual.userData.animacion(
                "idle"
            );


            const huesos =
                personajeActual.userData.bones
                    ? Object.keys(
                        personajeActual.userData.bones
                    ).length
                    : 0;


            estado.innerHTML =
                '<span class="ok">✅ Micaela cargada.</span>';


            info.innerHTML =
                "👩 Micaela<br>" +
                "🦴 Huesos detectados: " +
                huesos +
                "<br>" +
                "🎬 Animación: idle";


        } catch (error) {

            mostrarError(error);

        }

    }


    // =====================================================
    // CARGAR MIKE
    // =====================================================

    async function cargarMike() {

        limpiarVisor();

        prepararAnimaciones(
            "mike"
        );


        estado.innerHTML =
            '<span class="warn">🟡 Preparando Mike...</span>';

        info.textContent =
            "Cargando mecanica/mikeRig.js...";


        await new Promise(
            requestAnimationFrame
        );


        try {

            estado.innerHTML =
                '<span class="warn">⏳ Importando rig de Mike...</span>';


            const modulo =
                await import(
                    "../mecanicas/mikeRig.js?v=14"
                );


            estado.innerHTML =
                '<span class="warn">⏳ Ejecutando rig de Mike...</span>';


            await new Promise(
                requestAnimationFrame
            );


            personajeActual =
                await modulo.iniciarMikeRig(
                    visor
                );


            personajeActual.userData.animacion(
                "idle"
            );


            const huesos =
                personajeActual.userData.bones
                    ? Object.keys(
                        personajeActual.userData.bones
                    ).length
                    : 0;


            estado.innerHTML =
                '<span class="ok">✅ Mike cargado.</span>';


            info.innerHTML =
                "👦 Mike<br>" +
                "🦴 Huesos detectados: " +
                huesos +
                "<br>" +
                "🎬 Animación: idle";


        } catch (error) {

            mostrarError(error);

        }

    }


    // =====================================================
    // SELECTOR DE PERSONAJE
    // =====================================================

    personajeSelect.addEventListener(
        "change",
        () => {

            const elegido =
                personajeSelect.value;


            if (elegido === "mike") {

                cargarMike();

            } else {

                cargarMicaela();

            }

        }
    );


    // =====================================================
    // SELECTOR DE ANIMACIÓN
    // =====================================================

    animacionSelect.addEventListener(
        "change",
        () => {

            aplicarAnimacion(
                animacionSelect.value
            );

        }
    );


    // =====================================================
    // BOTÓN RECARGAR
    // =====================================================

    recargar.addEventListener(
        "click",
        () => {

            if (
                personajeSelect.value ===
                "mike"
            ) {

                cargarMike();

            } else {

                cargarMicaela();

            }

        }
    );


    // =====================================================
    // INICIO
    // =====================================================

    estado.innerHTML =
        '<span class="ok">🟢 JavaScript iniciado.</span>';

    info.textContent =
        "Iniciando visualizador...";


    await new Promise(
        requestAnimationFrame
    );


    if (
        personajeSelect.value ===
        "mike"
    ) {

        cargarMike();

    } else {

        cargarMicaela();

    }

</script>

</body>
    </html>
