<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAMERPRO — Rig Micaela</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family: Arial, sans-serif;
        }

        #editor {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;
        }

        #estado {
            position: fixed;

            top: 12px;
            left: 12px;

            z-index: 10;

            padding: 12px;

            color: white;

            background: rgba(0, 0, 0, 0.75);

            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div id="editor"></div>

    <div id="estado">
        🟡 Cargando Micaela...
    </div>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>


    <script type="module">

        import * as THREE from "three";

        import {
            GLTFLoader
        } from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


        const editor =
            document.getElementById("editor");

        const estado =
            document.getElementById("estado");


        // =================================================
        // ESCENA
        // =================================================

        const escena =
            new THREE.Scene();

        escena.background =
            new THREE.Color(0x87ceeb);


        // =================================================
        // CÁMARA
        // =================================================

        const camara =
            new THREE.PerspectiveCamera(
                45,
                window.innerWidth /
                window.innerHeight,
                0.01,
                1000
            );

        camara.position.set(
            0,
            1.5,
            5
        );


        // =================================================
        // RENDER
        // =================================================

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.5
            )
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        editor.appendChild(
            renderer.domElement
        );


        // =================================================
        // LUCES
        // =================================================

        escena.add(
            new THREE.HemisphereLight(
                0xffffff,
                0x555555,
                2
            )
        );


        const luz =
            new THREE.DirectionalLight(
                0xffffff,
                3
            );

        luz.position.set(
            3,
            6,
            5
        );

        escena.add(luz);


        // =================================================
        // MICAELA
        // =================================================

        const loader =
            new GLTFLoader();


        loader.load(

            "./3D/micaela.glb",

            (gltf) => {

                const micaela =
                    gltf.scene;


                escena.add(
                    micaela
                );


                // -----------------------------
                // CENTRAR
                // -----------------------------

                const caja =
                    new THREE.Box3()
                        .setFromObject(
                            micaela
                        );


                const centro =
                    new THREE.Vector3();


                caja.getCenter(
                    centro
                );


                micaela.position.sub(
                    centro
                );


                // -----------------------------
                // ENCUADRAR
                // -----------------------------

                const tamaño =
                    new THREE.Vector3();


                caja.getSize(
                    tamaño
                );


                const mayor =
                    Math.max(
                        tamaño.x,
                        tamaño.y,
                        tamaño.z
                    );


                camara.position.set(
                    0,
                    mayor * 0.4,
                    mayor * 2.8
                );


                camara.lookAt(
                    0,
                    mayor * 0.4,
                    0
                );


                estado.textContent =
                    "🟢 Micaela 3D cargada";


                console.log(
                    "🧍 Micaela cargada"
                );

            },


            undefined,


            (error) => {

                estado.textContent =
                    "🔴 Error cargando Micaela";

                console.error(
                    error
                );

            }

        );


        // =================================================
        // RESIZE
        // =================================================

        window.addEventListener(
            "resize",
            () => {

                camara.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camara.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // =================================================
        // LOOP
        // =================================================

        function animar() {

            requestAnimationFrame(
                animar
            );

            renderer.render(
                escena,
                camara
            );

        }


        animar();

    </script>

</body>

</html>
